[project]
name = "mcbuilder"
version = "0.1.0"
description = "Python tooling for AI agents that build Minecraft structures: builder DSL, block validator, multi-format export, preview renderer"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "lzif" }]
dependencies = [
    "numpy>=1.24",
    "pillow>=10.0",
    "nbtlib>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
mcbuild = "mcbuilder.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcbuilder"]
